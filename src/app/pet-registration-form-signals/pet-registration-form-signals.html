<div
  class="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 py-12 px-4 sm:px-6 lg:px-8"
>
  <div class="max-w-3xl mx-auto">
    <!-- Header Card -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">Registro de Mascota</h1>
      <p class="text-gray-600">Completa el formulario para registrar a tu mascota</p>
    </div>

    <!-- Form Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8 md:p-10 border border-gray-100">
      <form class="space-y-6">
        <!-- First Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label for="name" class="block text-sm font-semibold text-gray-700">
              Nombre de la Mascota <span class="text-red-500">*</span>
            </label>
            <input
              id="name"
              type="text"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-gray-50 hover:bg-white"
              placeholder="Ej: Max"
            />
          </div>

          <div class="space-y-2">
            <label for="type" class="block text-sm font-semibold text-gray-700">
              Tipo de Mascota <span class="text-red-500">*</span>
            </label>
            <select
              id="type"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-gray-50 hover:bg-white cursor-pointer"
            >
              <option value="" class="text-gray-400">Seleccione un tipo</option>
              @for (type of petTypes; track type) {
              <option [value]="type" class="text-gray-900">{{ type }}</option>
              }
            </select>
          </div>
        </div>

        <!-- Second Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label for="breed" class="block text-sm font-semibold text-gray-700">
              Raza <span class="text-red-500">*</span>
            </label>
            <input
              id="breed"
              type="text"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-gray-50 hover:bg-white"
              placeholder="Ej: Labrador"
            />
          </div>

          <div class="space-y-2">
            <label for="gender" class="block text-sm font-semibold text-gray-700">
              Género <span class="text-red-500">*</span>
            </label>
            <select
              id="gender"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-gray-50 hover:bg-white cursor-pointer"
            >
              <option value="" class="text-gray-400">Seleccione un género</option>
              @for (gender of genders; track gender) {
              <option [value]="gender" class="text-gray-900">{{ gender }}</option>
              }
            </select>
          </div>
        </div>

        <!-- Third Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label for="age" class="block text-sm font-semibold text-gray-700">
              Edad (años) <span class="text-red-500">*</span>
            </label>
            <input
              id="age"
              type="number"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-gray-50 hover:bg-white"
              placeholder="Ej: 3"
              min="0"
              max="30"
            />
          </div>

          <div class="space-y-2">
            <label for="weight" class="block text-sm font-semibold text-gray-700">
              Peso (kg)
            </label>
            <input
              id="weight"
              type="number"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-gray-50 hover:bg-white"
              placeholder="Ej: 15.5"
              min="0"
              step="0.1"
            />
          </div>
        </div>

        <!-- Fourth Row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label for="color" class="block text-sm font-semibold text-gray-700">
              Color <span class="text-red-500">*</span>
            </label>
            <input
              id="color"
              type="text"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-gray-50 hover:bg-white"
              placeholder="Ej: Marrón"
            />
          </div>

          <div class="space-y-2">
            <label for="birthDate" class="block text-sm font-semibold text-gray-700">
              Fecha de Nacimiento <span class="text-red-500">*</span>
            </label>
            <input
              id="birthDate"
              type="date"
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-gray-50 hover:bg-white cursor-pointer"
            />
          </div>
        </div>

        <!-- Observations -->
        <div class="space-y-2">
          <label for="observations" class="block text-sm font-semibold text-gray-700">
            Observaciones
          </label>
          <textarea
            id="observations"
            rows="4"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-gray-50 hover:bg-white resize-y min-h-[120px]"
            placeholder="Información adicional sobre la mascota..."
          ></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 pt-6 border-t border-gray-200">
          <button
            type="submit"
            class="flex-1 px-6 py-3.5 text-base font-semibold text-white bg-gradient-to-r from-blue-600 to-indigo-600 rounded-lg shadow-md hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all transform hover:scale-[1.02] active:scale-[0.98]"
          >
            Registrar Mascota
          </button>
          <button
            type="button"
            class="flex-1 px-6 py-3.5 text-base font-semibold text-gray-700 bg-white border-2 border-gray-300 rounded-lg hover:bg-gray-50 hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 transition-all transform hover:scale-[1.02] active:scale-[0.98]"
          >
            Limpiar Formulario
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
